<script>
const TZ='Asia/Qatar',HR=3600e3,DAY=864e5;
const BIZ=[];
const NOB={id:'',type:'shop',e:'🎁',n:['Shop','محل'],area:['',''],cats:[['Items','الأصناف']],menu:[],hours:[0,24],phone:'',dist:0,rating:0,rc:0,isNew:false};
const CARDS=[
{id:'bday',e:'🎂',n:['Birthday','عيد ميلاد'],g:['#ffd6e0','#ffb3c6']},
{id:'thx',e:'🙏',n:['Thank you','شكراً'],g:['#d8f3dc','#a8e0b8']},
{id:'cong',e:'🎉',n:['Congrats','مبروك'],g:['#fff0b3','#ffd166']},
{id:'enc',e:'💪',n:['Encouragement','تشجيع'],g:['#d0e8ff','#a2cdf7']},
{id:'eid',e:'🌙',n:['Eid','عيد'],g:['#e5d9ff','#c4b0f5']},
{id:'baby',e:'🍼',n:['New baby','مولود جديد'],g:['#ffe0cc','#ffc2a1']}];
const ST={
shop:[['Placed','تم الطلب'],['Accepted','تم القبول'],['Preparing','قيد التحضير'],['Ready','جاهز'],['Completed','مكتمل']],
salon:[['Booked','تم الحجز'],['Confirmed','تم التأكيد'],['Checked in','تم الاستقبال'],['In service','قيد الخدمة'],['Completed','مكتمل']]};
const GST=[['scheduled','Scheduled','مجدولة'],['sent','Sent','مرسلة'],['opened','Opened','مفتوحة'],['claimed','Claimed','تم استلامها'],['redeemed','Redeemed','تم صرفها'],['expired','Expired','منتهية']];

const S={view:'cust',lang:'ar',tab:'home',stack:[],q:'',filter:'all',cart:null,
 cf:{mode:'pickup',car:'',plate:'',notes:'',slot:0},
 uid:null,auth:null,ready:false,boot:false,recovery:false,me:{name:'',phone:''},canEdit:false,ext:{},mine:null,allShops:[],favRows:[],au:{step:'role',mode:'login',role:'customer',email:'',pw:'',name:'',phone:'',msg:'',ok:false,busy:false},
 orders:{},gifts:{},notes:{},shops:{},favs:[],loaded:{},
 meLoaded:false,reg:newReg(),rn:{},gf:null,sq:'',sflt:'',gcode:'',glist:'sent',rt:{n:0,c:''},rc:'',
 shopId:'',shopTab:'orders',adminTab:'overview',nm:{en:'',ar:'',p:'',e:'🛍️',c:0},deep:null};
const x=(e,a)=>S.lang==='ar'?a:e;
const nm=a=>a[S.lang==='ar'?1:0];
const bz=id=>BIZ.find(b=>b.id===id);
const sh=id=>S.shops[id]||{};
const money=n=>n+' '+x('QAR','ر.ق');
const BASE=location.href.split('#')[0].split('?')[0];
const curS=()=>S.stack[S.stack.length-1];
let keepScroll=true,tt=0,pending=false;

/* ---------- time helpers ---------- */
const dohaHour=d=>(+new Intl.DateTimeFormat('en-GB',{timeZone:TZ,hour:'2-digit',hour12:false}).format(d||new Date()))%24;
const hrs=b=>sh(b.id).hours||b.hours;
const isOpen=b=>{const h=dohaHour(),r=hrs(b);return h>=r[0]&&h<r[1]};
const loc=()=>S.lang==='ar'?'ar-QA-u-nu-latn':'en-GB';
const fmtDT=ts=>new Date(ts).toLocaleString(loc(),{timeZone:TZ,weekday:'short',day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});
const fmtD=ts=>new Date(ts).toLocaleDateString(loc(),{timeZone:TZ,day:'numeric',month:'short',year:'numeric'});
const dayStart=ts=>Math.floor((ts+3*HR)/DAY)*DAY-3*HR;
function slotsFor(b){const r=hrs(b),now=Date.now(),base=Math.ceil((now+1.5*HR)/HR)*HR,out=[];
 for(let ts=base;ts<now+40*HR&&out.length<5;ts+=2*HR){const hh=dohaHour(new Date(ts));if(hh>=r[0]&&hh<r[1])out.push(ts)}return out}

/* ---------- data helpers ---------- */
const need=b=>+sh(b.id).stamps||8;
const rewardOf=b=>x(sh(b.id).rEn||'A free item of your choice',sh(b.id).rAr||'عنصر مجاني من اختيارك');
function stampsOf(b,uid){let n=0;
 Object.values(S.orders).forEach(o=>{if(o.uid===uid&&o.biz===b.id&&o.status==='active'&&o.stage===4&&!o.giftCode)n++});
 Object.values(S.gifts).forEach(g=>{if(g.claimer===uid&&g.biz===b.id&&g.status==='redeemed')n++});return n}
const typeName=b=>b.type==='salon'?x('Salon','صالون'):x('Shop','متجر');
const isFav=k=>S.favs.includes(k);
const phKey=p=>String(p||'').replace(/\D/g,'').slice(-8);
const isRecv=g=>g.claimer===S.uid||(!g.claimer&&phKey(S.me.phone).length===8&&phKey(g.toPhone)===phKey(S.me.phone));
function gStatus(g){if(g.status==='redeemed')return 'redeemed';if(Date.now()>g.exp)return 'expired';if(g.sendAt&&Date.now()<g.sendAt)return 'scheduled';return g.status}
const gLabel=s=>{const r=GST.find(a=>a[0]===s);return r?x(r[1],r[2]):s};
const myNotes=()=>Object.values(S.notes).filter(n=>n.uid===S.uid).sort((a,b)=>b.ts-a.ts);
const stLabel=o=>o.status==='cancelled'?x('Cancelled','ملغي'):o.status==='rejected'?x('Rejected','مرفوض'):nm(ST[(bz(o.biz)||NOB).type][o.stage]);
const newId=p=>p+Date.now()+Math.floor(100+Math.random()*900);
function code6(){let c;do{c=String(Math.floor(100000+Math.random()*900000))}while(S.gifts[c]);return c}
const phoneIntl=p=>{const d=String(p).replace(/\D/g,'');return d.length===8?'974'+d:d};
const giftLink=c=>BASE+'?gift='+c;

/* ---------- init ---------- */
function beep(){try{const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.value=.15;o.start();setTimeout(()=>{o.stop();a.close()},350)}catch(e){}}
function toast(t){let e=$('toast');if(!e){e=document.createElement('div');e.id='toast';document.body.appendChild(e)}e.textContent=t;e.className='show';clearTimeout(tt);tt=setTimeout(()=>{e.className=''},2200)}
function applyLang(){document.documentElement.lang=S.lang;document.documentElement.dir=S.lang==='ar'?'rtl':'ltr'}
function setLang(){S.lang=S.lang==='ar'?'en':'ar';try{localStorage.setItem('sarva_lang',S.lang)}catch(e){}applyLang();render()}
function softRender(){const a=document.activeElement;if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&$('app')&&$('app').contains(a)){pending=true;return}render()}
document.addEventListener('focusout',()=>{if(pending){pending=false;setTimeout(()=>{const a=document.activeElement;if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)){pending=true;return}render()},350)}});

/* ---------- navigation ---------- */
function nav(){keepScroll=false}
function push(s){nav();S.stack.push(s);render()}
function back(){nav();S.stack.pop();render()}
function tab(t){nav();S.tab=t;S.stack=[];render()}
function setView(v){nav();S.view=v;render()}
function openShop(id){push({t:'shop',id})}
function openTrack(id){S.rt={n:0,c:''};push({t:'track',id})}
/* ---------- render ---------- */
function customer(){
 const s=curS();let body,head='',foot='';
 if(s)body=s.t==='shop'?vShop(s.id):s.t==='cart'?vCart():s.t==='track'?vTrack(s.id):s.t==='gf'?vGF():s.t==='gdetail'?vGiftDetail(s.code):s.t==='grecv'?vGiftRecv(s.code):s.t==='notes'?vNotes():s.t==='favs'?vFavs():s.t==='yg'?vYourGifts():s.t==='shops'?vPopular():s.t==='cards'?vCards():s.t==='reg'?`<div class="pad">${bk()}${vReg()}</div>`:s.t==='cprev'?vCardPrev(s.id):s.t==='pinfo'?vPinfo():s.t==='pset'?vPset():s.t==='stamps'?vStamps():s.t==='faq'?vFaq():s.t==='terms'?vTerms():s.t==='privacy'?vPrivacy():s.t==='fb'?vFb():'';
 else body=S.tab==='home'?vHome():S.tab==='gifts'?vGifts():S.tab==='orders'?vOrders():vProfile();
 if(body&&typeof body==='object'){head=body.head||'';foot=body.foot||'';body=body.body}
 const inGF=!!(s&&s.t==='gf');
 const cnt=S.cart?S.cart.lines.reduce((a,l)=>a+l.q,0):0;
 const cb=cnt&&!(s&&(s.t==='cart'||s.t==='gf'))?`<div class="cartbar" onclick="push({t:'cart'})"><span>🛒 ${cnt} ${x('items','أصناف')}</span><span>${money(cartTotal())} · ${x('View cart','عرض السلة')}</span></div>`:'';
 const tabs=[['home','🏠',x('Home','الرئيسية')],['gifts','🎁',x('Gifts','الهدايا')],['orders','📦',x('Orders','الطلبات')],['profile','👤',x('Profile','حسابي')]];
 const time=new Date().toLocaleTimeString('en-GB',{timeZone:TZ,hour:'2-digit',minute:'2-digit'});
 return `<div class="stage"><div class="phone"><div class="island"></div><div class="sbar"><span>${time}</span><span>5G ▮▮▮</span></div>${head}<div class="scroll">${body}</div>${foot}${cb}${inGF?'':`<div class="tabs">${tabs.map(t=>`<button class="${S.tab===t[0]?'on':''}" onclick="tab('${t[0]}')"><span>${t[1]}</span>${t[2]}</button>`).join('')}</div>`}<div class="hind"></div></div></div>`}
const bk=()=>`<button class="back" onclick="back()"><span class="chev">‹</span> ${x('Back','رجوع')}</button>`;

/* ---------- home ---------- */
function vHome(){
 const unread=S.me.notif===false?0:myNotes().filter(n=>!n.read).length;
 const seen=[],rec=[];Object.values(S.orders).filter(o=>o.uid===S.uid&&o.status!=='cancelled').sort((a,b)=>b.ts-a.ts).forEach(o=>{if(!seen.includes(o.biz)&&bz(o.biz)&&(sh(o.biz).status||'approved')==='approved'&&rec.length<3){seen.push(o.biz);rec.push(bz(o.biz))}});
 const chips=[['all',x('All','الكل')],['salon',x('Salons','صوالين')],['shop',x('Shops','متاجر')],['open',x('Open now','مفتوح الآن')],['top',x('Top rated','الأعلى تقييماً')]];
 return `<div class="pad"><div class="row"><div><div class="sub m0">${x('Welcome','أهلاً')}${S.me.name?', '+h(S.me.name):''}</div><h1>Sarva</h1></div><button class="ibtn" onclick="openNotes()">🔔${unread?`<b class="dot">${unread}</b>`:''}</button></div>
 <div class="hero" onclick="startGift()"><div><b>${x('Send a gift','أرسل هدية')}</b><div class="sub m0" style="color:var(--bt)">${x('Gift a service or product from a local salon or shop','اهدِ خدمة أو منتج من صالون أو متجر')}</div></div><span class="big">🎁</span></div>
 <input id="q" value="${h(S.q)}" placeholder="${x('Search salons, shops, items','ابحث عن صالون أو متجر أو منتج')}" oninput="S.q=this.value;$('shoplist').innerHTML=shopList()">
 <div class="chips">${chips.map(c=>`<button class="${S.filter===c[0]?'on':''}" onclick="S.filter='${c[0]}';render()">${c[1]}</button>`).join('')}</div>
 ${rec.length?`<h2>${x('Order again','اطلب مرة ثانية')}</h2>`+rec.map(b=>`<div class="card row click" onclick="openShop('${b.id}')"><div class="row g"><div class="emo">${b.e}</div><div><b>${h(nm(b.n))}</b><div class="sub m0">${stampsOf(b,S.uid)%need(b)}/${need(b)} ${x('stamps','أختام')} ${isOpen(b)?'':`· <span class="st bad">${x('Closed','مغلق')}</span>`}</div></div></div><span class="chev">›</span></div>`).join(''):''}
 <h2>${x('Salons & shops','الصوالين والمتاجر')}</h2><div id="shoplist">${shopList()}</div></div>`}
function shopList(){
 const q=S.q.trim().toLowerCase();
 let list=visibleShops().filter(b=>{
  if(S.filter==='salon'&&b.type!=='salon')return false;if(S.filter==='shop'&&b.type!=='shop')return false;if(S.filter==='open'&&!isOpen(b))return false;
  if(q){const hay=(b.n.join(' ')+' '+menuOf(b).map(m=>m.n.join(' ')).join(' ')).toLowerCase();if(!hay.includes(q))return false}return true});
 if(S.filter==='top')list=list.slice().sort((a,b)=>ratingOf(b).avg-ratingOf(a).avg);
 return list.length?list.map(shopCard).join(''):`<p class="empty">${x('No results','ما فيه نتائج')}</p>`}
function statusPill(b){return sh(b.id).busy?`<span class="st bad">${x('Busy','مشغول')}</span>`:isOpen(b)?`<span class="st ok">${x('Open','مفتوح')}</span>`:`<span class="st bad">${x('Closed','مغلق')}</span>`}
function shopCard(b){const r=ratingOf(b);
 return `<div class="card row click" onclick="openShop('${b.id}')"><div class="row g"><div class="emo">${b.e}</div><div><b>${h(nm(b.n))}</b> <span class="pill">${typeName(b)}</span>${b.isNew?` <span class="pill ok">${x('New','جديد')}</span>`:''}<div class="sub m0">${rtxt(r)} · ${b.dist?b.dist+' '+x('km','كم')+' · ':''}${statusPill(b)}</div></div></div><span class="chev">›</span></div>`}

/* ---------- shop page ---------- */
function vShop(id){
 if(!bz(id))return `<div class="pad">${bk()}<p class="empty">${x('This shop is not available','المحل غير متوفر')}</p></div>`;
 const b=bz(id),open=isOpen(b),busy=!!sh(id).busy,can=open&&!busy,salon=b.type==='salon',menu=menuOf(b),r=ratingOf(b),hr=hrs(b);
 const cats=b.cats.map((c,ci)=>{const its=menu.filter(m=>(m.c||0)===ci);if(!its.length)return'';
  return `<h2>${h(nm(c))}</h2>`+its.map(m=>`<div class="card row"><div class="row g"><div class="emo">${m.e}</div><div><b>${h(nm(m.n))}</b><div class="sub m0">${money(m.p)}</div></div></div>
  <div class="row" style="gap:6px"><button class="ibtn" onclick="toggleFav('i:${id}|${m.id}')">${isFav('i:'+id+'|'+m.id)?'♥':'♡'}</button>${m.off?`<span class="pill">${x('Unavailable','غير متوفر')}</span>`:`<button class="btn sm sec" onclick="startGift('${id}','${m.id}')">🎁</button><button class="btn sm" ${can?'':'disabled'} onclick="addCart('${id}','${m.id}')">${salon?x('Book','احجز'):x('Order','اطلب')}</button>`}</div></div>`).join('')}).join('');
 return `<div class="pad"><div class="row">${bk()}<button class="ibtn" onclick="toggleFav('s:${id}')">${isFav('s:'+id)?'♥':'♡'}</button></div>
 <div class="row g"><div class="emo big">${b.e}</div><div><h1>${h(nm(b.n))}</h1><div class="sub m0">${typeName(b)} · ${h(nm(b.area))} · ${rtxt(r)}</div><div class="sub m0">${hr[0]}:00 – ${hr[1]}:00 · ${statusPill(b)}</div></div></div>
 ${busy?`<div class="banner bad">${x('This place is busy and not taking new orders right now.','المكان مشغول ولا يستقبل طلبات جديدة الحين.')}</div>`:!open?`<div class="banner">${x('Closed now. You can still send gifts.','مغلق الحين. تقدر ترسل هدايا.')}</div>`:''}
 <button class="btn" style="margin-top:8px" onclick="startGift('${id}')">🎁 ${x('Send a gift from here','أرسل هدية من هنا')}</button>${cats}</div>`}
/* ---------- cart & orders ---------- */
const cartTotal=()=>{if(!S.cart)return 0;const m=menuOf(bz(S.cart.biz));return S.cart.lines.reduce((a,l)=>{const it=m.find(i=>i.id===l.id);return a+(it?it.p*l.q:0)},0)};
function addCart(bid,iid){const b=bz(bid);if(!isOpen(b)||sh(bid).busy)return toast(x('Not taking orders right now','ما يستقبل طلبات الحين'));
 if(S.cart&&S.cart.biz!==bid){S.cart=null;toast(x('Cart switched to ','تم تغيير السلة إلى ')+nm(b.n))}else toast('✓ '+x('Added','انضاف'));
 if(!S.cart)S.cart={biz:bid,lines:[]};const l=S.cart.lines.find(l=>l.id===iid);l?l.q++:S.cart.lines.push({id:iid,q:1});render()}
function cq(i,d){S.cart.lines[i].q+=d;if(S.cart.lines[i].q<=0)S.cart.lines.splice(i,1);if(!S.cart.lines.length){S.cart=null;nav();S.stack=[]}render()}
function modeSeg(salon,b){
 if(salon){const sl=slotsFor(b);if(!sl.includes(S.cf.slot))S.cf.slot=sl[0]||0;
  return `<h2>${x('Pick a time','اختر الوقت')}</h2>`+(sl.length?`<div class="seg">${sl.map(t=>`<button class="${S.cf.slot===t?'on':''}" onclick="S.cf.slot=${t};render()">${fmtDT(t)}</button>`).join('')}</div>`:`<div class="banner">${x('No free slots soon','ما فيه مواعيد قريبة')}</div>`)}
 return `<h2>${x('How do you want it?','كيف تبي تستلم؟')}</h2><div class="seg">${[['pickup',x('Pickup','استلام')],['curbside',x('Curbside','من السيارة')],['instore',x('In-store','داخل المتجر')]].map(m=>`<button class="${S.cf.mode===m[0]?'on':''}" onclick="S.cf.mode='${m[0]}';render()">${m[1]}</button>`).join('')}</div>`+
  (S.cf.mode==='curbside'&&(S.cf.car=S.cf.car||S.me.car||'',S.cf.plate=S.cf.plate||S.me.plate||'',true)?`<input placeholder="${x('Car color','لون السيارة')}" value="${h(S.cf.car)}" oninput="S.cf.car=this.value"><input dir="ltr" placeholder="${x('Plate number','رقم اللوحة')}" value="${h(S.cf.plate)}" oninput="S.cf.plate=this.value">`:'')}
function vCart(){
 if(!S.cart||!S.cart.lines.length)return `<div class="pad">${bk()}<p class="empty">${x('Your cart is empty','السلة فاضية')}</p></div>`;
 const b=bz(S.cart.biz),salon=b.type==='salon',menu=menuOf(b);
 const lines=S.cart.lines.map((l,i)=>{const m=menu.find(m=>m.id===l.id);if(!m)return'';return `<div class="card row"><div><b>${m.e} ${h(nm(m.n))}</b><div class="sub m0">${money(m.p*l.q)}</div></div><div class="qty"><button onclick="cq(${i},-1)">−</button>${l.q}<button onclick="cq(${i},1)">+</button></div></div>`}).join('');
 return `<div class="pad">${bk()}<h1>${x('Cart','السلة')}</h1><div class="sub">${h(nm(b.n))} · ${h(nm(b.area))}</div>${lines}${modeSeg(salon,b)}
 <textarea rows="2" placeholder="${x('Notes (optional)','ملاحظات (اختياري)')}" oninput="S.cf.notes=this.value">${h(S.cf.notes)}</textarea>
 <h2>${x('Payment','الدفع')}</h2><div class="seg"><button class="on">${salon?x('Pay at the salon','الدفع في الصالون'):x('Pay at pickup','الدفع عند الاستلام')}</button><button disabled style="opacity:.5">${x('Pay online (coming soon)','الدفع أونلاين (قريباً)')}</button></div>
 <div class="card row"><b>${x('Total','المجموع')}</b><b>${money(cartTotal())}</b></div>
 <button class="btn" onclick="placeOrder()">${salon?x('Confirm booking','تأكيد الحجز'):x('Place order','تأكيد الطلب')}</button></div>`}
function vOrders(){
 const all=Object.values(S.orders).filter(o=>o.uid===S.uid&&bz(o.biz)).sort((a,b)=>b.ts-a.ts);
 const act=all.filter(o=>o.status==='active'&&o.stage<4),past=all.filter(o=>!(o.status==='active'&&o.stage<4));
 return `<div class="pad"><h1>${x('Orders','الطلبات')}</h1>${!all.length?`<p class="empty">${x('No orders yet','ما فيه طلبات للحين')}</p>`:''}${act.length?`<h2>${x('Active','نشطة')}</h2>`+act.map(o=>orderRow(o,0)).join(''):''}${past.length?`<h2>${x('Past','السابقة')}</h2>`+past.map(o=>orderRow(o,1)).join(''):''}</div>`}
function orderRow(o,past){const b=bz(o.biz);
 return `<div class="card click" onclick="openTrack('${o.id}')"><div class="row"><b>${h(nm(b.n))} · #${o.num}</b><span class="pill ${o.status==='active'&&o.stage===4?'ok':o.status!=='active'?'bad':''}">${stLabel(o)}</span></div><div class="sub m0">${o.items.map(i=>i.q+'× '+h(nm(i.n))).join('، ')}</div>
 <div class="row" style="margin-top:8px"><span class="sub m0">${o.giftCode?'🎁 ':''}${money(o.total)}</span>${past&&!o.giftCode?`<button class="btn sm sec" onclick="event.stopPropagation();reorder('${o.id}')">${x('Reorder','أعد الطلب')}</button>`:''}${past&&o.status==='active'&&!o.rating?`<span class="pill">⭐ ${x('Rate','قيّم')}</span>`:''}</div></div>`}
function reorder(id){const o=S.orders[id],b=bz(o.biz),m=menuOf(b);const lines=o.items.filter(i=>m.find(z=>z.id===i.id&&!z.off)).map(i=>({id:i.id,q:i.q}));
 if(!lines.length)return toast(x('Items unavailable','الأصناف غير متوفرة'));S.cart={biz:b.id,lines};push({t:'cart'})}
function vTrack(id){
 const o=S.orders[id];if(!o)return `<div class="pad">${bk()}<p class="empty">${x('Order not found','الطلب غير موجود')}</p></div>`;
 const b=bz(o.biz),st=ST[b.type],hist=o.hist||[],dead=o.status!=='active';
 const tl=st.map((s,i)=>{const hh=hist.find(z=>z.s===i);const on=!dead&&o.stage>=i;return `<div class="s ${on?'on':''}"><i></i><div>${nm(s)}${hh&&on?`<div class="sub m0">${fmtDT(hh.ts)}</div>`:''}</div></div>`}).join('');
 const mode=o.mode==='appointment'?`📅 ${fmtDT(o.slot)}`:o.mode==='curbside'?`🚗 ${x('Curbside','من السيارة')} · ${h(o.carColor)} ${h(o.carPlate)}`:o.mode==='instore'?x('In-store','داخل المتجر'):x('Pickup','استلام');
 const rate=!dead&&o.stage===4&&!o.rating?`<div class="card"><b>${x('How was it?','كيف كانت التجربة؟')}</b><div class="stars">${[1,2,3,4,5].map(n=>`<button class="${S.rt.n>=n?'on':''}" onclick="S.rt.n=${n};render()">★</button>`).join('')}</div><textarea rows="2" placeholder="${x('Comment','تعليق')}" oninput="S.rt.c=this.value">${h(S.rt.c)}</textarea><button class="btn" onclick="submitRate('${id}')">${x('Send rating','أرسل التقييم')}</button></div>`:o.rating?`<div class="banner ok">★ ${o.rating} · ${x('Thanks for your rating','شكراً على تقييمك')}</div>`:'';
 return `<div class="pad">${bk()}<h1>${x('Order tracking','تتبع الطلب')} #${o.num}</h1>
 ${o.status==='cancelled'?`<div class="banner bad">${x('Cancelled','ملغي')}</div>`:o.status==='rejected'?`<div class="banner bad">${x('The shop could not accept this order.','المحل ما قدر يقبل الطلب.')}</div>`:''}
 <div class="card"><div class="tl">${tl}</div>${o.eta&&!dead&&o.stage<4?`<div class="sub m0">⏱ ${x('Estimated time','الوقت المتوقع')}: ${h(o.eta)} ${x('min','دقيقة')}</div>`:''}</div>
 <div class="card"><div class="row"><b>${b.e} ${h(nm(b.n))}</b><a class="btn sm sec" href="tel:${b.phone}">📞 ${x('Call','اتصل')}</a></div><div class="sub m0">${h(nm(b.area))}</div><div class="sub m0">${mode}${o.notes?' · '+h(o.notes):''}</div></div>
 <div class="card">${o.items.map(i=>`<div class="row"><span>${i.e} ${h(nm(i.n))} × ${i.q}</span><span>${money(i.p*i.q)}</span></div>`).join('')}<div class="row" style="margin-top:8px"><b>${x('Total','المجموع')}</b><b>${o.giftCode?'🎁 '+x('Gift','هدية'):money(o.total)}</b></div></div>
 ${rate}
 ${!dead&&o.stage===0?`<button class="btn bad" onclick="cancelOrder('${id}')">${x('Cancel order','إلغاء الطلب')}</button><div class="sub" style="text-align:center;margin-top:6px">${x('You can cancel only before the shop accepts.','تقدر تلغي فقط قبل ما يقبل المحل.')}</div>`:''}</div>`}
/* ---------- gifts ---------- */
function cardHTML(cid,msg,from,img){
 if(cid==='custom'){return `<div class="gcard cust" style="${img?`background-image:linear-gradient(rgba(0,0,0,.15),rgba(0,0,0,.55)),url(${img})`:'background:var(--bb2)'}"><div class="gt">${x('My card','بطاقتي')}</div><div class="gm">${h(msg||x('Your message appears here','رسالتك تظهر هنا'))}</div>${from?`<div class="gf">— ${h(from)}</div>`:''}</div>`}
 const c=CARDS.find(c=>c.id===cid)||CARDS[0];
 return `<div class="gcard" style="background:linear-gradient(135deg,${c.g[0]},${c.g[1]})"><span class="dec d1">${c.e}</span><span class="dec d2">${c.e}</span><span class="dec d3">${c.e}</span><div class="gem">${c.e}</div><div class="gt">${h(nm(c.n))}</div><div class="gm">${h(msg||x('Your message appears here','رسالتك تظهر هنا'))}</div>${from?`<div class="gf">— ${h(from)}</div>`:''}</div>`}
const monthStart=()=>{const d=+new Intl.DateTimeFormat('en-GB',{timeZone:TZ,day:'numeric'}).format(new Date());return dayStart(Date.now())-(d-1)*DAY};
function trending(){const cnt={};
 Object.values(S.orders).forEach(o=>o.items.forEach(i=>{cnt[i.id]=(cnt[i.id]||0)+i.q}));Object.values(S.gifts).forEach(g=>g.items.forEach(i=>{cnt[i.id]=(cnt[i.id]||0)+i.q}));
 const all=[];visibleShops().forEach(b=>menuOf(b).forEach((m,i)=>{if(!m.off)all.push({b,m,s:(cnt[m.id]||0)*10+(8-i)+b.rating})}));
 return all.sort((a,c)=>c.s-a.s).slice(0,8)}
function tile(b,m,label,fn){return `<div class="tile"><div class="tphoto" onclick="${fn}">${m.e}</div><b>${h(nm(m.n))}</b><div class="sub m0">${h(nm(b.n))}</div><div class="pr">${money(m.p)}</div><button class="seeall" onclick="${fn}">${label}</button></div>`}
function popRow(fn){return `<div class="hrow">${visibleShops().slice().sort((a,c)=>ratingOf(c).avg-ratingOf(a).avg).map(b=>{const r=ratingOf(b);return `<div class="pshop" onclick="${fn}('${b.id}')"><div class="plogo">${b.e}</div><b>${h(nm(b.n))}</b><div class="sub m0">${rtxt(r)}</div></div>`}).join('')}</div>`}
function giftRow(g,mode){const b=bz(g.biz)||NOB,st=gStatus(g);
 return `<div class="card row click" onclick="${mode==='sent'?`push({t:'gdetail',code:'${g.code}'})`:`openRecv('${g.code}')`}"><div class="row g"><div class="emo">${(CARDS.find(c=>c.id===g.card)||CARDS[0]).e}</div><div><b>${h(nm(b.n))}</b><div class="sub m0">${g.items.map(i=>i.q+'× '+h(nm(i.n))).join('، ')}</div><div class="sub m0">${mode==='sent'?x('To ','إلى ')+h(g.toName):x('From ','من ')+h(g.fromName)}</div></div></div><span class="pill ${st==='redeemed'?'ok':st==='expired'?'bad':''}">${gLabel(st)}</span></div>`}
function vGifts(){
 const unread=S.me.notif===false?0:myNotes().filter(n=>!n.read).length,ms=monthStart();

function openEditor(src,done){
 const old=document.getElementById('ed');if(old)old.remove();
 const im=new Image();
 im.onerror=()=>toast(x('Could not read this image','ما قدرت أقرأ الصورة'));
 im.onload=()=>{
  const FW=Math.min(360,Math.max(240,(document.documentElement.clientWidth||360)-32)),FH=Math.round(FW*0.64);
  const st={rot:0,flip:1,z:1,ox:0,oy:0,f:'orig',br:0};
  const root=document.createElement('div');root.id='ed';root.className='edwrap';
  root.innerHTML=`<div class="edin"><h2 style="margin:4px 0 2px">${x('Edit your card photo','عدّل صورة بطاقتك')}</h2><div class="sub">${x('Drag to move · pinch or use the slider to zoom','اسحب لتحريك الصورة · قرّب بالإصبعين أو بالشريط')}</div>
  <canvas id="edc" width="${FW}" height="${FH}" style="width:${FW}px;height:${FH}px"></canvas>
  <div class="edrow"><span>🔍</span><input id="edz" type="range" min="1" max="4" step="0.01" value="1"></div>
  <div class="edrow"><span>☀️</span><input id="edb" type="range" min="-60" max="60" step="1" value="0"></div>
  <div class="edrow" style="gap:8px"><button class="btn sec sm" id="edr">⟳ ${x('Rotate','تدوير')}</button><button class="btn sec sm" id="edfl">⇋ ${x('Flip','قلب')}</button><button class="btn sec sm" id="edrs">↺ ${x('Reset','إعادة')}</button></div>
  <div class="chips" id="edf">${EF.map(f=>`<button data-f="${f[0]}" class="${f[0]==='orig'?'on':''}">${x(f[1][0],f[1][1])}</button>`).join('')}</div>
  <div class="row" style="gap:8px;margin-top:6px"><button class="btn sec" id="edx">${x('Cancel','إلغاء')}</button><button class="btn" id="edok">${x('Save card','احفظ البطاقة')}</button></div></div>`;
  document.body.appendChild(root);
  const cv=root.querySelector('#edc'),ctx=cv.getContext('2d');
  function geom(W,H){const sw=st.rot%2?im.height:im.width,sh=st.rot%2?im.width:im.height,sc=Math.max(W/sw,H/sh)*st.z;return {sw,sh,sc}}
  function clamp(W,H){const g=geom(W,H),mx=Math.max(0,(g.sw*g.sc-W)/2),my=Math.max(0,(g.sh*g.sc-H)/2);st.ox=Math.max(-mx,Math.min(mx,st.ox));st.oy=Math.max(-my,Math.min(my,st.oy))}
  function paint(c,W,H,k){const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,W,H);const gm=geom(W,H);
   g.save();g.translate(W/2+st.ox*k,H/2+st.oy*k);g.rotate(st.rot*Math.PI/2);g.scale(st.flip*gm.sc,gm.sc);g.drawImage(im,-im.width/2,-im.height/2);g.restore();
   const F=(EF.find(a=>a[0]===st.f)||EF[0])[2];if(!Object.keys(F).length&&!st.br)return;
   try{const d=g.getImageData(0,0,W,H),p=d.data,con=F.con||1,sat=F.sat||1,gr=F.gray||0,wm=F.warm||0,b=(F.br||0)+st.br;
    for(let i=0;i<p.length;i+=4){let r=p[i],gg=p[i+1],bb=p[i+2];
     const l=.299*r+.587*gg+.114*bb;r=l+(r-l)*sat;gg=l+(gg-l)*sat;bb=l+(bb-l)*sat;
     if(gr){r=gg=bb=l}
     if(wm){r+=14*wm;bb-=14*wm}
     r=(r-128)*con+128+b;gg=(gg-128)*con+128+b;bb=(bb-128)*con+128+b;
     p[i]=r<0?0:r>255?255:r;p[i+1]=gg<0?0:gg>255?255:gg;p[i+2]=bb<0?0:bb>255?255:bb}
    g.putImageData(d,0,0)}catch(e){}}
  const draw=()=>{clamp(FW,FH);paint(cv,FW,FH,1)};
  draw();
  // pointer: drag + pinch
  const ptr=new Map();let pd=0;
  cv.style.touchAction='none';
  cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,[e.clientX,e.clientY]);if(ptr.size===2){const a=[...ptr.values()];pd=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1])}};
  cv.onpointermove=e=>{if(!ptr.has(e.pointerId))return;const pv=ptr.get(e.pointerId);

   ptr.set(e.pointerId,[e.clientX,e.clientY]);
   if(ptr.size===2){const a=[...ptr.values()],d=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);if(pd){st.z=Math.max(1,Math.min(4,st.z*d/pd));root.querySelector('#edz').value=st.z}pd=d}
   draw()};
  cv.onpointerup=cv.onpointercancel=e=>{ptr.delete(e.pointerId);pd=0};

  root.querySelector('#edz').oninput=e=>{st.z=+e.target.value;draw()};
  root.querySelector('#edb').oninput=e=>{st.br=+e.target.value;draw()};
  root.querySelector('#edr').onclick=()=>{st.rot=(st.rot+1)%4;st.ox=st.oy=0;draw()};
  root.querySelector('#edfl').onclick=()=>{st.flip*=-1;draw()};
  root.querySelector('#edrs').onclick=()=>{st.rot=0;st.flip=1;st.z=1;st.ox=st.oy=0;st.f='orig';st.br=0;root.querySelector('#edz').value=1;root.querySelector('#edb').value=0;root.querySelectorAll('#edf button').forEach(b=>b.className=b.dataset.f==='orig'?'on':'');draw()};
  root.querySelectorAll('#edf button').forEach(b=>b.onclick=()=>{st.f=b.dataset.f;root.querySelectorAll('#edf button').forEach(z=>z.className=z===b?'on':'');draw()});
  root.querySelector('#edx').onclick=()=>root.remove();
  root.querySelector('#edok').onclick=()=>{const OW=624,OH=Math.round(OW*0.64),oc=document.createElement('canvas');oc.width=OW;oc.height=OH;
   const k=OW/FW,sv={ox:st.ox,oy:st.oy};paint(oc,OW,OH,k);
   let q=.78,d=oc.toDataURL('image/jpeg',q);while(d.length>70000&&q>.3){q-=.1;d=oc.toDataURL('image/jpeg',q)}
   root.remove();done(d)};
 };

async function shrink(dataUrl){return new Promise((res,rej)=>{const im=new Image();im.onerror=()=>rej(new Error('image'));im.onload=()=>{
 let k=Math.min(1,1000/Math.max(im.width,im.height)),ql=.85;const go=()=>{const c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));c.getContext('2d').drawImage(im,0,0,c.width,c.height);
  c.toBlob(b=>{if(!b)return rej(new Error('image'));if(b.size>900*1024&&ql>.5){ql-=.15;k*=.85;return go()}res(b)},'image/jpeg',ql)};go()};im.src=dataUrl})}
async function uploadCard(dataUrl){const blob=await shrink(dataUrl),path=S.uid+'/'+(crypto.randomUUID?crypto.randomUUID():Date.now()+''+Math.random().toString(16).slice(2))+'.jpg';
 const r=await sb.storage.from('cards').upload(path,blob,{contentType:'image/jpeg'});if(r.error)throw r.error;return path}
function addMyCard(){if(myCards().length>=8)return toast(x('You can save up to 8 cards. Delete one first.','تقدر تحفظ ٨ بطاقات. احذف وحدة أول.'));
 const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=()=>{const f=i.files&&i.files[0];if(!f)return;readImg(f,src=>openEditor(src,async d=>{
  try{const path=await uploadCard(d),row=await q(sb.from('saved_cards').insert({user_id:S.uid,image_path:path}).select().single());
   const c={id:row.id,path,img:pubCard(path)};S.me.cards=myCards().concat([c]);const g=S.gf;if(g&&curS()&&curS().t==='gf'){g.card='custom';g.img=c.img}render();toast(x('Card saved ✓','تم حفظ البطاقة ✓'))}catch(e){fail(e,['Could not save the card','ما قدرنا نحفظ البطاقة'])}}))};i.click()}
function editMy(id){const c=myCards().find(z=>z.id===id);if(!c)return;openEditor(c.img,async d=>{
 try{const path=await uploadCard(d);await q(sb.from('saved_cards').update({image_path:path}).eq('id',id));try{await sb.storage.from('cards').remove([c.path])}catch(_){}
  S.me.cards=myCards().map(z=>z.id===id?{id,path,img:pubCard(path)}:z);render();toast(x('Card updated ✓','تم تحديث البطاقة ✓'))}catch(e){fail(e)}})}
async function delMy(id){const c=myCards().find(z=>z.id===id);if(!c)return;
 try{await q(sb.from('saved_cards').delete().eq('id',id));try{await sb.storage.from('cards').remove([c.path])}catch(_){}S.me.cards=myCards().filter(z=>z.id!==id);back();toast(x('Card deleted','تم حذف البطاقة'))}catch(e){fail(e)}}
async function payGift(){const g=S.gf,items=gfItems();if(!items.length||busyW)return;busyW=true;
 try{const mc=g.card==='custom'?myCards().find(c=>c.img===g.img):null;
  if(g.card==='custom'&&!mc)return toast(x('Pick one of your saved cards','اختر وحدة من بطاقاتك المحفوظة'));
  const sendAt=g.when==='later'?Date.parse(g.at):0;if(g.when==='later'&&!(sendAt>Date.now()))return toast(x('Pick a future date and time','اختر وقت في المستقبل'));
  const row=await q(sb.from('gifts').insert({sender_id:S.uid,shop_id:g.biz,card:g.card,card_image:mc?mc.path:null,message:g.msg.trim(),to_name:g.toName.trim(),to_phone:g.toPhone.trim(),send_at:sendAt?isoMs(sendAt):new Date().toISOString()}).select('code,id').single());
  try{await q(sb.from('gift_items').insert(items.map(i=>({gift_id:row.id,shop_id:g.biz,item_id:i.id,qty:i.q}))))}catch(e){throw e}
  await loadGifts();S.gf=null;nav();S.stack=[{t:'gdetail',code:row.code}];S.tab='gifts';render();toast(x('Gift created 🎁','تم إنشاء الهدية 🎁'))}
 catch(e){fail(e,['Could not create the gift','ما قدرنا ننشئ الهدية'])}finally{busyW=false}}
async function openRecv(code){
 try{let g=S.gifts[code];
  if(!g){const j=await q(sb.rpc('get_gift',{p_code:String(code).trim()}));if(!j)return toast(x('Gift not found','الهدية غير موجودة'));g=mapGift(j.gift,j.items,{from_name:j.from_name});S.ext[g.code]=g;S.gifts[g.code]=g;code=g.code;
   if(!bz(g.biz)&&j.shop){BIZ.push({id:j.shop.id,type:j.shop.type,e:j.shop.emoji,n:[j.shop.name_en||j.shop.name_ar,j.shop.name_ar||j.shop.name_en],area:['',''],dist:0,rating:0,rc:0,isNew:false,hours:[0,24],phone:'',cats:[['Items','الأصناف']],menu:[]});S.shops[j.shop.id]={status:'approved',hours:[0,24],items:[],busy:false}}}
  if(gStatus(g)==='sent'&&g.from!==S.uid){try{await sb.rpc('open_gift',{p_code:code});g.status='opened'}catch(e){}}
  if(isRecv(g)&&!g.claimer&&g.from!==S.uid&&['sent','opened'].includes(gStatus(g))){await q(sb.rpc('claim_gift',{p_code:code}));await loadGifts()}
  nav();if(curS()&&curS().t==='grecv')S.stack.pop();S.stack.push({t:'grecv',code});render()}
 catch(e){fail(e)}}
async function claimGift(code){const g=S.gifts[code],st=gStatus(g);if(st!=='sent'&&st!=='opened')return;
 try{await q(sb.rpc('claim_gift',{p_code:code}));await Promise.all([loadGifts(),loadShops()]);render();toast(x('Gift claimed 🎁','تم استلام الهدية 🎁'))}catch(e){fail(e)}}
async function thankGift(code){try{await q(sb.rpc('thank_gift',{p_code:code}));if(S.gifts[code])S.gifts[code].thanks=true;render();toast('💛')}catch(e){fail(e)}}
async function placeGiftOrder(code){const g=S.gifts[code],b=bz(g.biz),f=S.cf,salon=b.type==='salon';if(busyW)return;
 if(!isOpen(b)||sh(b.id).busy)return toast(x('Not taking orders right now','ما يستقبل طلبات الحين'));
 if(!salon&&f.mode==='curbside'&&!(f.plate.trim()&&f.car.trim()))return toast(x('Enter your car color and plate number','اكتب لون السيارة ورقم اللوحة'));
 if(salon&&!f.slot)return toast(x('No free slots','ما فيه مواعيد'));
 busyW=true;
 try{const id=await insertOrder({...orderFields(b,{...f,notes:''},salon),gift_id:g.id,pay:'Gift'},g.items.map(i=>({id:i.id,q:i.q})));await loadOrders();openTrack(id);toast(x('Order placed ✓','تم إرسال الطلب ✓'))}
 catch(e){fail(e,['Could not place the order','ما قدرنا نرسل الطلب'])}finally{busyW=false}}
async function redeemGift(g){await q(sb.rpc('redeem_gift',{p_code:g.code}))}
async function redeemCode(){const c=(S.rc||'').trim(),g=S.gifts[c];if(!g||!(S.canEdit||g.biz===S.shopId))return toast(x('Code not found','الكود غير موجود'));if(g.biz!==S.shopId)return toast(x('This gift is for another shop','هذي الهدية لمحل ثاني'));
 const st=gStatus(g);if(st==='redeemed')return toast(x('Already redeemed','انصرفت من قبل'));if(st==='expired')return toast(x('Expired','منتهية'));if(st==='scheduled')return toast(x('Not available yet','مو متاحة للحين'));if(st!=='claimed')return toast(x('Not claimed by the receiver yet','المستلم ما استلمها للحين'));
 try{await redeemGift(g);const o=Object.values(S.orders).find(o=>o.giftCode===c&&o.status==='active'&&o.stage<4);if(o)await q(sb.from('orders').update({stage:4}).eq('id',o.id));
  S.rc='';await Promise.all([loadGifts(),loadOrders()]);render();toast(x('Gift redeemed ✓','تم صرف الهدية ✓'))}catch(e){fail(e)}}
async function sendFb(){const t=($('fbt').value||'').trim();if(!t)return toast(x('Write something first','اكتب شي أول'));
 try{await q(sb.from('feedback').insert({user_id:S.uid,body:t.slice(0,2000)}));toast(x('Thank you for your feedback 💛','شكراً على رأيك 💛'));back()}catch(e){fail(e)}}

/* ---------- shop dashboard writes ---------- */
const SHOPCOL={status:'status',busy:'busy',stamps:'stamps_needed',rEn:'reward_en',rAr:'reward_ar'};
async function putShop(id,patch){const s=S.shops[id]||(S.shops[id]={}),db={};
 Object.keys(patch).forEach(k=>{if(k==='hours'){db.open_hour=patch.hours[0];db.close_hour=patch.hours[1]}else if(SHOPCOL[k])db[SHOPCOL[k]]=patch[k];s[k]=patch[k]});
 if(db.stamps_needed!=null&&!(db.stamps_needed>=2&&db.stamps_needed<=20)){toast(x('Stamps: 2 to 20','الأختام: من ٢ إلى ٢٠'));await loadShops();return render()}
 if(db.open_hour!=null&&!(db.close_hour>db.open_hour&&db.open_hour>=0&&db.close_hour<=24)){toast(x('Closing time must be after opening','وقت الإغلاق لازم يكون بعد الفتح'));await loadShops();return render()}
 render();try{await q(sb.from('shops').update(db).eq('id',id));await loadShops();render()}catch(e){fail(e);loadShops().then(render)}}
async function toggleOff(id){const it=(sh(S.shopId).items||[]).find(m=>m.id===id);if(!it)return;
 try{await q(sb.from('menu_items').update({available:it.off}).eq('id',id));await loadShops();render()}catch(e){fail(e);loadShops().then(render)}}
async function delExtra(id){
 try{await q(sb.from('menu_items').delete().eq('id',id));await loadShops();render()}
 catch(e){try{await q(sb.from('menu_items').update({available:false}).eq('id',id));await loadShops();render();toast(x('This item has past orders, so it was hidden instead','الصنف عليه طلبات سابقة، فتم إخفاؤه'))}catch(e2){fail(e2)}}}
async function addExtra(){const f=S.nm;if(!f.en.trim()&&!f.ar.trim()||!(+f.p>0))return toast(x('Enter a name and price','اكتب الاسم والسعر'));
 const s=sh(S.shopId),cid=(s.cat0||[])[+f.c]||null;
 try{await q(sb.from('menu_items').insert({shop_id:S.shopId,category_id:cid,name_en:f.en.trim()||f.ar.trim(),name_ar:f.ar.trim()||f.en.trim(),price:+f.p,emoji:(f.e||'🛍️').trim().slice(0,8)||'🛍️',sort:(s.items||[]).length}));
  S.nm={en:'',ar:'',p:'',e:'🛍️',c:0};await loadShops();render();toast(x('Item added','تمت الإضافة'))}catch(e){fail(e)}}

/* ---------- business registration ---------- */
function openBiz(){const a=myApp();if(a&&a.status==='approved'){S.view='shop';nav();render()}else push({t:'reg'})}
function ownerHome(){const a=myApp();
 if(a&&a.status==='approved'&&bz(a.bid)){S.shopId=a.bid;return shopDash()}
 return `<div class="panel"><div class="wrap" style="max-width:480px">${vReg()}</div></div>`}
function regInp(k,ph,extra){return `<input ${extra||''} placeholder="${ph}" value="${h(S.reg[k])}" oninput="S.reg.${k}=this.value">`}
function pickDoc(el){const f=el.files&&el.files[0];if(!f)return;if(f.size>10*1024*1024){el.value='';return toast(x('File is too large (max 10 MB)','الملف كبير (الحد ١٠ ميغا)'))}
 if(!/^(image\/(jpeg|png|webp)|application\/pdf)$/.test(f.type)){el.value='';return toast(x('Use a PDF or a photo (JPG/PNG)','استخدم PDF أو صورة (JPG/PNG)'))}S.reg.file=f;const n=$('docname');if(n)n.textContent='✓ '+f.name}
function fillReg(){const s=S.mine,r=S.reg;if(r.init)return;r.init=true;r.owner=r.owner||S.me.name||'';r.email=r.email||(S.auth&&S.auth.email)||'';r.phone=r.phone||'';
 if(s&&s.status==='rejected'){Object.assign(r,{type:s.type,nAr:s.name_ar,nEn:s.name_en,area:s.area_ar,phone:s.phone,o:s.open_hour,c:s.close_hour,owner:s.owner_name,email:s.contact_email,cr:s.cr_number,exp:s.cr_expiry||'',address:s.address,maps:s.maps_link,ig:s.instagram})}}
function vReg(){const a=myApp(),r=S.reg;fillReg();
 if(a&&a.status==='pending')return `<h1>${x('Under review','قيد المراجعة')}</h1><div class="card"><div class="row g"><div class="emo">⏳</div><div><b>${h(a.nAr||a.nEn)}</b><div class="sub m0">${a.type==='salon'?x('Salon','صالون'):x('Shop','متجر')} · ${h(a.area)}</div></div></div></div><div class="banner">${x('We received your request and are verifying your commercial registration. You will be notified when it is approved.','وصلنا طلبك وجاري التحقق من السجل التجاري. بيوصلك إشعار إذا تم اعتماده.')}</div>`;
 if(a&&a.status==='suspended')return `<h1>${x('Business suspended','المحل موقوف')}</h1><div class="banner bad">${x('Your business is suspended. Contact Sarva.','محلك موقوف. تواصل مع سارفا.')}</div>`;
 if(a&&a.status==='approved')return `<h1>${x('Your business is live','محلك شغال')} 🎉</h1><div class="card"><b>${h(a.nAr||a.nEn)}</b></div><button class="btn" onclick="openBiz()">${x('Open my dashboard','افتح لوحة محلي')}</button>`;
 const hrsOpt=(v,lo,hi)=>Array.from({length:hi-lo+1},(_,i)=>lo+i).map(n=>`<option value="${n}" ${n===+v?'selected':''}>${String(n).padStart(2,'0')}:00</option>`).join('');
 return `<h1>${x('Register your business','سجّل محلك')}</h1>${a&&a.status==='rejected'?`<div class="banner bad">${x('Your last request was not approved.','طلبك السابق ما انقبل.')} ${h(a.note||'')}<br>${x('Fix the details and send it again.','صحّح البيانات وأرسله مرة ثانية.')}</div>`:''}
 <div class="seg"><button class="${r.type==='salon'?'on':''}" onclick="S.reg.type='salon';render()">💇 ${x('Salon','صالون')}</button><button class="${r.type==='shop'?'on':''}" onclick="S.reg.type='shop';render()">🛍️ ${x('Shop','متجر')}</button></div>
 <div class="card"><b>${x('Business details','بيانات المحل')}</b>${regInp('nAr',x('Business name (Arabic)','اسم المحل (عربي)'))}${regInp('nEn',x('Business name (English, optional)','اسم المحل (إنجليزي، اختياري)'),'dir="ltr"')}${regInp('area',x('Area (e.g. The Pearl)','المنطقة (مثال: اللؤلؤة)'))}${regInp('address',x('Full address','العنوان بالتفصيل'))}${regInp('phone',x('Business phone','جوال المحل'),'dir="ltr" inputmode="tel"')}${regInp('maps',x('Google Maps link (optional)','رابط قوقل ماب (اختياري)'),'dir="ltr"')}${regInp('ig',x('Instagram (optional)','انستقرام (اختياري)'),'dir="ltr"')}
 <label class="sub">${x('Opening hours (Doha time)','ساعات العمل (بتوقيت الدوحة)')}</label><div class="row"><select onchange="S.reg.o=+this.value">${hrsOpt(r.o,0,23)}</select><select onchange="S.reg.c=+this.value">${hrsOpt(r.c,1,24)}</select></div></div>
 <div class="card"><b>${x('Owner and commercial registration','المالك والسجل التجاري')}</b>${regInp('owner',x('Owner full name','اسم المالك الكامل'))}${regInp('email',x('Contact e-mail','إيميل التواصل'),'dir="ltr" type="email"')}${regInp('cr',x('Commercial registration number (السجل التجاري)','رقم السجل التجاري'),'dir="ltr"')}
 <label class="sub">${x('Registration expiry date','تاريخ انتهاء السجل')}</label><input type="date" dir="ltr" value="${h(r.exp)}" oninput="S.reg.exp=this.value">
 <label class="sub">${x('Upload the commercial registration (PDF or photo)','ارفع صورة السجل التجاري (PDF أو صورة)')}</label><input type="file" accept="image/jpeg,image/png,image/webp,application/pdf" onchange="pickDoc(this)"><div class="sub m0" id="docname">${r.file?'✓ '+h(r.file.name):''}</div></div>
 <button class="btn" ${busyW?'disabled':''} onclick="submitApp()">${x('Send for review','أرسل للمراجعة')}</button><div class="sub" style="text-align:center;margin-top:8px">${x('Only Sarva can see your documents. After approval you can add your menu and start receiving orders.','المستندات ما يشوفها إلا فريق سارفا. بعد الاعتماد تضيف قائمتك وتبدأ تستقبل الطلبات.')}</div>`}
async function submitApp(){const r=S.reg,prev=S.mine;if(busyW)return;
 if(!(r.nAr.trim()||r.nEn.trim()))return toast(x('Enter the business name','اكتب اسم المحل'));if(!r.area.trim())return toast(x('Enter the area','اكتب المنطقة'));
 if(String(r.phone).replace(/\D/g,'').length<8)return toast(x('Enter a valid phone number','اكتب رقم جوال صحيح'));if(r.c<=r.o)return toast(x('Closing time must be after opening','وقت الإغلاق لازم يكون بعد الفتح'));
 if(!r.owner.trim())return toast(x('Enter the owner name','اكتب اسم المالك'));if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(r.email.trim()))return toast(x('Enter a valid e-mail','اكتب إيميل صحيح'));
 if(!/^[0-9A-Za-z\/ -]{3,30}$/.test(r.cr.trim()))return toast(x('Enter the commercial registration number (3–30 letters/digits)','اكتب رقم السجل التجاري (٣–٣٠ حرف أو رقم)'));
 if(!r.exp)return toast(x('Enter the registration expiry date','اكتب تاريخ انتهاء السجل'));if(r.exp<new Date().toISOString().slice(0,10))return toast(x('The commercial registration has expired','السجل التجاري منتهي'));
 if(!r.file&&!(prev&&prev.cr_document))return toast(x('Upload the commercial registration document','ارفع مستند السجل التجاري'));
 busyW=true;render();
 try{let path=prev&&prev.cr_document;
  if(r.file){const ext=(r.file.name.split('.').pop()||'bin').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,5)||'bin';path=S.uid+'/'+Date.now()+'-cr.'+ext;
   const up=await sb.storage.from('shop-docs').upload(path,r.file,{contentType:r.file.type});if(up.error)throw up.error}
  const row={type:r.type,name_ar:r.nAr.trim(),name_en:r.nEn.trim(),area_ar:r.area.trim(),area_en:r.area.trim(),phone:r.phone.trim(),emoji:r.type==='salon'?'💇':'🛍️',open_hour:r.o,close_hour:r.c,owner_name:r.owner.trim(),contact_email:r.email.trim(),cr_number:r.cr.trim(),cr_expiry:r.exp,cr_document:path,address:r.address.trim(),maps_link:r.maps.trim(),instagram:r.ig.trim()};
  if(prev)await q(sb.from('shops').update({...row,status:'pending'}).eq('id',prev.id));else await q(sb.from('shops').insert({...row,owner_id:S.uid,status:'pending'}));
  r.file=null;await loadShops();toast(x('Request sent ✓','تم إرسال الطلب ✓'))}
 catch(e){fail(e,['Could not send the request','ما قدرنا نرسل الطلب'])}finally{busyW=false;render()}}
async function decideApp(id,ok){const s=S.allShops.find(z=>z.id===id);if(!s)return;const note=ok?'':((S.rn[id]||'').trim().slice(0,300));
 try{await q(sb.from('shops').update({status:ok?'approved':'rejected',review_note:note}).eq('id',id));await loadShops();render()}catch(e){fail(e)}}
async function viewDoc(path){try{const r=await sb.storage.from('shop-docs').createSignedUrl(path,120);if(r.error)throw r.error;window.open(r.data.signedUrl,'_blank','noopener')}catch(e){fail(e)}}
const appList=()=>(S.allShops||[]).filter(s=>s.owner_id);
function vApps(){const l=appList().sort((a,c)=>(a.status==='pending'?0:1)-(c.status==='pending'?0:1)||tms(c.created_at)-tms(a.created_at));
 const lab=s=>s==='pending'?x('Pending','قيد المراجعة'):s==='approved'?x('Approved','معتمد'):s==='suspended'?x('Suspended','موقوف'):x('Rejected','مرفوض');
 return l.length?l.map(a=>`<div class="card"><div class="row"><b>${a.type==='salon'?'💇':'🛍️'} ${h(a.name_ar||a.name_en)} ${a.name_en&&a.name_ar?`<span class="sub">(${h(a.name_en)})</span>`:''}</b><span class="pill ${a.status==='approved'?'ok':a.status==='pending'?'':'bad'}">${lab(a.status)}</span></div>
 <div class="sub m0">${h(a.area_ar)} · <span dir="ltr">${h(a.phone)}</span> · ${a.open_hour}–${a.close_hour}</div><div class="sub m0">${x('Owner','المالك')}: ${h(a.owner_name||'—')} · <span dir="ltr">${h(a.contact_email)}</span> · ${fmtDT(tms(a.created_at))}</div>
 <div class="sub m0">${x('Address','العنوان')}: ${h(a.address||'—')}</div><div class="sub m0">${x('CR','السجل')}: <b dir="ltr">${h(a.cr_number)}</b> · ${x('expires','ينتهي')} <span dir="ltr">${h(a.cr_expiry||'—')}</span></div>
 ${a.cr_document?`<button class="btn sm sec" onclick="viewDoc('${h(a.cr_document)}')">📄 ${x('View document','عرض المستند')}</button>`:''}
 ${a.status==='pending'?`<input placeholder="${x('Reason if rejecting (optional)','سبب الرفض (اختياري)')}" value="${h(S.rn[a.id]||'')}" oninput="S.rn['${a.id}']=this.value"><div class="row" style="gap:8px"><button class="btn sm bad" onclick="decideApp('${a.id}',false)">${x('Reject','رفض')}</button><button class="btn sm" onclick="decideApp('${a.id}',true)">${x('Approve','اعتماد')}</button></div>`:''}</div>`).join(''):`<p class="empty">${x('No requests yet','ما فيه طلبات للحين')}</p>`}

init();
</script>
